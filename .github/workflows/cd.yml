name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker & Verify K8s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t churn-api:${{ github.sha }} -t churn-api:latest .

      - name: Container Smoke Test
        run: |
          docker run -d -p 8000:8000 --name api-smoke-test \
            -e API_KEY="cd-smoke-test-key" \
            -e CORS_ORIGINS="http://localhost:3000" \
            churn-api:latest

          sleep 5
          docker logs api-smoke-test
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health

          docker stop api-smoke-test
          docker rm api-smoke-test

      - name: Validate Kubernetes Manifests
        run: |
          pip install pyyaml
          python - <<'EOF'
          import yaml, glob, sys
          files = glob.glob("k8s/*.yaml")
          if not files:
              print("No YAML files found in k8s/", file=sys.stderr)
              sys.exit(1)
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"OK: {f}")
          print("All Kubernetes manifests are valid YAML.")
          EOF
