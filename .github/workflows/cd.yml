name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker & Verify K8s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t churn-api:${{ github.sha }} -t churn-api:latest .

      - name: Container Smoke Test
        run: |
          docker run -d -p 8000:8000 --name api-smoke-test \
            -e API_KEY="cd-smoke-test-key" \
            -e CORS_ORIGINS="http://localhost:3000" \
            churn-api:latest

          sleep 5
          docker logs api-smoke-test
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health

          docker stop api-smoke-test
          docker rm api-smoke-test

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/
